name: Compilar PWA a APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor y envolver la PWA
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Dosis Pedia" com.dosispedia.app --web-dir .
          npx cap add android

      - name: Copiar iconos al proyecto Android
        run: |
          mkdir -p android/app/src/main/res/drawable
          [ -f icon-512.png ] && cp icon-512.png android/app/src/main/res/drawable/icon.png || true
          npx cap sync android

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: dosis-pedia-apk
          path: android/app/build/outputs/apk/debug/*.apk
